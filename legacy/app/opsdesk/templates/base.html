<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}OpsDesk — tickets IT{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='logo.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <header class="site">
    <a class="brand" href="{{ url_for('list_page') }}">
      <img src="{{ url_for('static', filename='logo.svg') }}" alt="">
      <strong>OpsDesk</strong>
    </a>
    <span class="tagline">Support IT · laboratoire InfraOps</span>
  </header>
  <main>
    <div class="notice">Données fictives uniquement · démonstrateur local sans authentification · ne pas exposer sur Internet.</div>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <span>Version {{ identity.version }}</span><span class="dot">·</span>
    <span>Révision {{ identity.revision }}</span><span class="dot">·</span>
    <span>PostgreSQL persistant</span>
  </footer>
</body>
</html>
