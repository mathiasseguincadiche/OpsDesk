# OpsDesk — pile de référence : PostgreSQL + API FastAPI + interface React/nginx.
# Docker Engine avec le plugin Compose (commande `docker compose`).
#
#   cp .env.example .env      # puis changer les mots de passe
#   docker compose up -d --build
#   → http://localhost:8080
#
# Ce fichier est le livrable de l'application : il construit les images et prouve
# qu'une version démarre. Le déploiement sur srv-app (images tirées de GHCR par
# digest, secrets en fichiers, réglages du serveur) est l'exercice 06 du parcours.
name: opsdesk

# Rotation des journaux : sans limite, le pilote json-file de Docker remplit le disque.
x-journaux: &journaux
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-opsdesk}
      POSTGRES_USER: ${DB_USER:-opsdesk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]
    # Aucun port publié : seule l'API joint la base, par le réseau interne.
    networks: [backend]
    logging: *journaux

  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-2.0.0}
        APP_REVISION: ${APP_REVISION:-dev}
    image: ${REGISTRY:-localhost}/opsdesk-api:${APP_VERSION:-2.0.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-opsdesk}
      DB_USER: ${DB_USER:-opsdesk}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@opsdesk.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD manquant dans .env}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      # Publié sur 127.0.0.1 seulement : /metrics (Prometheus) et /api/docs (Swagger) en local.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    # L'image porte déjà un HEALTHCHECK, que Docker applique. Le redéclarer ici rend la
    # sonde visible dans la définition du déploiement et réglable sans reconstruire l'image.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    networks: [backend, frontend]
    logging: *journaux

  frontend:
    build:
      context: ./frontend
      args:
        APP_VERSION: ${APP_VERSION:-2.0.0}
        APP_REVISION: ${APP_REVISION:-dev}
    image: ${REGISTRY:-localhost}/opsdesk-frontend:${APP_VERSION:-2.0.0}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      # Démonstration locale : ne pas publier par défaut sur le réseau.
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt: ["no-new-privileges:true"]
    networks: [frontend]
    logging: *journaux

volumes:
  db-data:

networks:
  # La base n'est que sur « backend » : nginx ne peut pas la joindre.
  backend:
  frontend:
