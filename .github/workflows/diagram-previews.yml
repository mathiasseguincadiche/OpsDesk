name: Architecture V2 — PNG preview

on:
  pull_request:
    paths:
      - "docs/diagrams/**"
      - ".github/workflows/diagram-previews.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Attach the published PNG preview
        uses: actions/upload-artifact@v4
        with:
          name: architecture-globale-public-preview
          path: docs/diagrams/architecture-globale.png
          if-no-files-found: error
          retention-days: 14
