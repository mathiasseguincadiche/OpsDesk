name: One-time retirement of archived unmerged qualification branches
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/privacy-retire-archived-branches.yml
permissions:
  contents: write
  pull-requests: read
jobs:
  remove-archived-heads:
    if: github.repository == 'mathiasseguincadiche/OpsDesk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Delete only archived branch heads after exact SHA validation
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          from urllib.parse import quote

          repository = os.environ['REPOSITORY']
          assert repository == 'mathiasseguincadiche/OpsDesk'
          root = 'https://api.github.com/repos/' + repository
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def request(path, method='GET'):
              req = Request(root + path, headers=headers, method=method)
              with urlopen(req, timeout=30) as response:
                  content = response.read()
                  return json.loads(content) if content else None

          # Each branch was archived as a complete changed-file snapshot
          # in a personal private workspace before this workflow was created.
          # There are no remote force pushes or Git object rewrites here.
          targets = [
              ("docs/qualite-redactionnelle-v26-20261122-b", "bd28fcf325c5f6a8abbeb3528a22bee94d020826"),
              ("qualification/demarrage-simple", "aaa9dd28a9d150f25db999c496416e47f2caa96f"),
              ("qualification/recette-visuelle-v25", "35716a92ce5ccba874ab80ff27fbd4fac74e6a18"),
              ("qualification/reference-v25-20261119", "18c30fd8b36a7853bd27a30ec721839fa00e84e1"),
              ("qualification/socle-20261119", "5b69654c29a4dc39d43db72ed572962a37294d9e"),
              ("qualification/v26-20261119", "7bedd5ebbfa689a67063b08e0886dd51bb00d9dc"),
              ("qualification/v26-finition-20261119", "07aa70a90e81898f0b355336875d930efa97b4e8"),
              ("qualification/v26-stabilisation", "464c0b22316e1b38f849d063974170a8bbc1477c"),
              ("qualification/v26-stabilisation-finale", "41d8aff6757b0146c3f318d1be38eb69792bf66e"),
              ("qualification/v26-visuel-securite-20261119", "e885562e0a25ddc3e7a092fd2281e8342c71cd64"),
          ]

          open_pulls = request('/pulls?state=open&per_page=100')
          if len(open_pulls) >= 100:
              raise RuntimeError('Open PR list truncated; refusing branch removal')
          active = {p.get('head', {}).get('ref') for p in open_pulls}

          # Preflight all 10 before doing any DELETE.
          for name, expected_sha in targets:
              if name in active or name == 'main':
                  raise RuntimeError('Branch has active PR: ' + name)
              ref_path = '/git/ref/heads/' + quote(name, safe='/')
              current = request(ref_path)
              if current['object']['sha'] != expected_sha:
                  raise RuntimeError('HEAD changed since private archive: ' + name)
          print(f'Preflight succeeded for {len(targets)} exact branch HEADs')

          count = 0
          for name, expected_sha in targets:
              ref_path = '/git/refs/heads/' + quote(name, safe='/')
              request(ref_path, method='DELETE')
              try:
                  request('/git/ref/heads/' + quote(name, safe='/'))
              except HTTPError as exc:
                  if exc.code != 404:
                      raise
              else:
                  raise RuntimeError('Branch remains after DELETE: ' + name)
              print('Removed archived branch: ' + name)
              count += 1
          if count != len(targets):
              raise RuntimeError('Incomplete branch retirement')
          print(f'Verified: {count} archived heads removed; main remains unchanged')
          PY
