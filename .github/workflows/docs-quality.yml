name: Documentation quality (no deployment)

# Exécuter les contrôles uniquement si la documentation ou ses outils changent.
on:
  pull_request:
    paths:
      - 'README.md'
      - 'STATUS.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CHANGELOG.md'
      - '.github/**'
      - 'ROADMAP.md'
      - 'docs/**'
      - 'scripts/check_docs.py'
      - '.github/workflows/docs-quality.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'STATUS.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CHANGELOG.md'
      - '.github/**'
      - 'ROADMAP.md'
      - 'docs/**'
      - 'scripts/check_docs.py'
      - '.github/workflows/docs-quality.yml'
  workflow_dispatch:

# Droits minimaux : lecture seule, aucun déploiement.
permissions:
  contents: read

# Vérifie les liens, les visuels PNG et SVG, les sources Draw.io et les contrats Python.
# Ne valide ni une VM Rocky ni le rendu graphique sur un navigateur.
jobs:
  docs-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout revision under review
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check documentation, graphics and paths offline
        run: |
          python3 scripts/check_docs.py
          python3 -m unittest discover -s scripts -p 'test_check_docs.py'
