name: Qualification ponctuelle — stabilisation du socle
on:
  push:
    branches: ["qualification/v26-stabilisation"]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: opsdesk_test
          POSTGRES_PASSWORD: qualification-only
          POSTGRES_DB: opsdesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opsdesk_test -d opsdesk_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 53831b28e3447fe5585d5ec6d48201474e4a7355
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tests et lint de l'API (SQLite puis PostgreSQL jetable)
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          python -m ruff check app tests
          python -m pytest -q
          TEST_DATABASE_URL=postgresql+psycopg://opsdesk_test:qualification-only@127.0.0.1:5432/opsdesk_test python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 53831b28e3447fe5585d5ec6d48201474e4a7355
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 53831b28e3447fe5585d5ec6d48201474e4a7355
          persist-credentials: false
      - name: Recette Compose sur runner jetable
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .env
          export APP_REVISION="$(git rev-parse HEAD)"
          docker version --format '{{.Server.Version}}'
          docker compose version
          trap 'docker compose down -v --remove-orphans' EXIT
          docker compose config --quiet
          docker compose up -d --build --pull always --wait --wait-timeout 180
          docker compose ps
          python3 - <<'PY'
          import json, subprocess
          for service, host_port, port in [('frontend','8080','8080/tcp'),('backend','8000','8000/tcp')]:
              cid=subprocess.check_output(['docker','compose','ps','-q',service],text=True).strip()
              obj=json.loads(subprocess.check_output(['docker','inspect',cid],text=True))[0]
              assert obj['NetworkSettings']['Ports'][port]==[{'HostIp':'127.0.0.1','HostPort':host_port}]
              print(service, 'publication 127.0.0.1:'+host_port, 'OK')
          cid=subprocess.check_output(['docker','compose','ps','-q','db'],text=True).strip()
          obj=json.loads(subprocess.check_output(['docker','inspect',cid],text=True))[0]
          assert all(v is None for v in obj['NetworkSettings']['Ports'].values())
          print('PostgreSQL non publié: OK')
          PY
          curl --fail --silent --show-error http://127.0.0.1:8080/health/ready
          python3 scripts/smoke.py http://127.0.0.1:8080
          # Une requête réseau non autorisée doit échouer, sans masquer une autre erreur.
          for port in 8080 8000; do
            set +e
            docker run --rm --add-host=host.docker.internal:host-gateway curlimages/curl:8.12.1 --silent --show-error --connect-timeout 3 --max-time 5 "http://host.docker.internal:$port/health/ready"
            rc=$?
            set -e
            test "$rc" -eq 7 -o "$rc" -eq 28
            echo "Port $port refusé depuis un autre espace réseau (code curl $rc)"
          done
          # Créer une donnée témoin, sans consigner le jeton de session.
          cat > /tmp/witness.py <<'PY'
          import json, sys, urllib.request
          base = 'http://127.0.0.1:8080'
          def http(path, payload=None, token=None):
              headers={'Content-Type':'application/json'}
              if token: headers['Authorization']='Bearer '+token
              req=urllib.request.Request(base+path, headers=headers, data=None if payload is None else json.dumps(payload).encode())
              with urllib.request.urlopen(req, timeout=10) as r: return json.load(r)
          token=http('/api/auth/login',{'email':'julie.durand@opsdesk.local','password':'Demo1234!'})['access_token']
          title='Qualification de persistance — ticket témoin'
          if sys.argv[1]=='create':
              t=http('/api/tickets', {'title':title,'priority':'high','category':'network'},token)
              with open('/tmp/witness-id','w') as f: f.write(str(t['id']))
              print('Ticket témoin créé:',t['id'])
          else:
              id=open('/tmp/witness-id').read().strip()
              t=http('/api/tickets/'+id,token=token)
              assert t['title']==title,(t['id'],t['title'])
              print('Ticket témoin relu:',id)
          PY
          python3 /tmp/witness.py create
          # API arrêtée : réponse bornée, mais l'interface reste vivante.
          docker compose stop backend
          result=$(curl -sS --max-time 8 -o /dev/null -w '%{http_code} %{time_total}' http://127.0.0.1:8080/health/ready)
          echo "API arrêtée : $result"
          python3 -c 'import sys; s,t=sys.argv[1].split(); assert s in ("502","504") and float(t)<8' "$result"
          curl --fail --silent --show-error http://127.0.0.1:8080/healthz
          docker compose up -d --wait --wait-timeout 180
          for i in $(seq 1 30); do
            if curl --fail --silent --max-time 4 http://127.0.0.1:8080/health/ready >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error --max-time 8 http://127.0.0.1:8080/health/ready
          echo 'Reprise API vérifiée'
          # Base arrêtée : le processus API vit, mais le service n'est pas prêt.
          docker compose stop db
          code=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health/ready)
          echo "Base arrêtée : readiness=$code"
          test "$code" = 503
          curl --fail --silent --show-error --max-time 8 http://127.0.0.1:8000/health/live
          docker compose up -d --wait --wait-timeout 180
          for i in $(seq 1 30); do
            if curl --fail --silent --max-time 4 http://127.0.0.1:8080/health/ready >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error --max-time 8 http://127.0.0.1:8080/health/ready
          echo 'Reprise PostgreSQL vérifiée'
          docker compose down
          docker compose up -d --wait --wait-timeout 180
          python3 /tmp/witness.py check
          echo 'PERSISTANCE OK après recréation des trois conteneurs'

          test ! -e .env
          echo "Démarrage sans .env et persistance vérifiés"
          mkdir -p /tmp/scan /tmp/rapport
          for service in backend frontend db; do
            image="$(docker inspect -f '{{.Image}}' "$(docker compose ps -q "$service")")"
            docker image inspect "$image" --format '{{.Id}} {{.RepoDigests}}'
            docker save "$image" -o "/tmp/scan/$service.tar"
          done
          docker pull aquasec/trivy:0.74.0
          for service in backend frontend db; do
            docker run --rm -v /tmp/scan:/scan aquasec/trivy:0.74.0 image --input "/scan/$service.tar" --scanners vuln,secret --format json --output "/scan/$service.json" --timeout 10m
          done
          docker run --rm -v "$PWD:/src:ro" -v /tmp/scan:/scan aquasec/trivy:0.74.0 fs --scanners secret --format json --output /scan/repo.json --skip-dirs /src/.git --skip-dirs /src/legacy /src
          python3 - <<'PY'
          import collections,json,pathlib
          for name in ("backend","frontend","db","repo"):
              doc=json.loads(pathlib.Path("/tmp/scan/"+name+".json").read_text())
              counts=collections.Counter()
              findings=[]
              for r in doc.get("Results",[]):
                  for v in r.get("Vulnerabilities") or []:
                      counts[v.get("Severity","UNKNOWN")]+=1
                      findings.append({"target":r.get("Target"),**{k:v.get(k) for k in ("VulnerabilityID","PkgName","InstalledVersion","FixedVersion","Severity")}})
                  for v in r.get("Secrets") or []:
                      counts["SECRET"]+=1
                      findings.append({"type":"secret","target":r.get("Target"),"rule":v.get("RuleID"),"start":v.get("StartLine")})
              pathlib.Path("/tmp/rapport/"+name+".json").write_text(json.dumps({"counts":dict(counts),"findings":findings},indent=2))
              print(name,dict(counts))
              for v in findings:
                  if v.get("Severity")=="CRITICAL" or (v.get("Severity")=="HIGH" and v.get("FixedVersion")):
                      print(v)
          PY
          echo 'Binaire de changement de privilèges :'
          docker compose exec -T db gosu --version
          docker cp "$(docker compose ps -q db):/usr/local/bin/gosu" /tmp/gosu
          go version -m /tmp/gosu | tee /tmp/rapport/gosu-version.txt
          # L'analyse de symboles complète le scan de versions, ne masque aucune alerte.
          if GOBIN=/tmp/bin go install golang.org/x/vuln/cmd/govulncheck@latest; then
            set +e
            /tmp/bin/govulncheck -mode=binary /tmp/gosu > /tmp/rapport/gosu-govulncheck.txt 2>&1
            rc=$?
            set -e
            echo "govulncheck exit=$rc" | tee -a /tmp/rapport/gosu-govulncheck.txt
            cat /tmp/rapport/gosu-govulncheck.txt
          else
            echo "Analyse de symboles indisponible (installation)" | tee /tmp/rapport/gosu-govulncheck.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-stabilisation
          path: /tmp/rapport
          retention-days: 14
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 53831b28e3447fe5585d5ec6d48201474e4a7355
          persist-credentials: false
      - name: Contrôler les liens relatifs et les quinze paires graphiques
        run: |
          python3 - <<'PY'
          import pathlib,re,urllib.parse,xml.etree.ElementTree as ET
          root=pathlib.Path.cwd()
          files=[root/"README.md",root/"STATUS.md",root/"ROADMAP.md",*sorted((root/"docs").rglob("*.md"))]
          count=0
          missing=[]
          for f in files:
              body=re.sub(r"(?ms)^(\x60{3,}|~{3,}).*?^\1[ \t]*$","",f.read_text())
              for m in re.finditer(r"\]\(([^)\s]+)\)",body):
                  link=m.group(1)
                  if link.startswith(("#","http:","https:","mailto:")): continue
                  dest=urllib.parse.unquote(link.split("#",1)[0])
                  if not dest: continue
                  count+=1
                  if not (f.parent/dest).exists(): missing.append((str(f.relative_to(root)),link))
          print(f"Liens relatifs : {count}, fichiers : {len(files)}")
          print("Manquants :",missing)
          assert not missing
          p=root/"docs/diagrams"
          sources=list(p.glob("*.drawio"))
          assert len(sources)==15 and len(list(p.glob("*.svg")))==15
          for s in sources:
              ET.parse(s)
              ET.parse(s.with_suffix(".svg"))
          print("15 paires graphiques : XML valide")
          PY
