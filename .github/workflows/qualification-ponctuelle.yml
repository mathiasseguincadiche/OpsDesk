name: Qualification ponctuelle du socle
on:
  push:
    branches: ["qualification/socle-20261119"]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: opsdesk_test
          POSTGRES_PASSWORD: qualification-only
          POSTGRES_DB: opsdesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opsdesk_test -d opsdesk_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tests et lint de l'API (SQLite puis PostgreSQL jetable)
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          python -m ruff check app tests
          python -m pytest -q
          TEST_DATABASE_URL=postgresql+psycopg://opsdesk_test:qualification-only@127.0.0.1:5432/opsdesk_test python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Recette Compose sur runner jetable
        shell: bash
        run: |
          set -euo pipefail
          export DB_PASSWORD="$(openssl rand -hex 20)"
          export JWT_SECRET="$(openssl rand -hex 32)"
          export ADMIN_PASSWORD="$(openssl rand -hex 20)"
          printf '::add-mask::%s\n' "$DB_PASSWORD" "$JWT_SECRET" "$ADMIN_PASSWORD"
          export APP_REVISION="$(git rev-parse HEAD)"
          export SEED_DEMO_DATA=true ALLOW_REGISTRATION=true
          docker version --format '{{.Server.Version}}'
          docker compose version
          trap 'docker compose down -v --remove-orphans' EXIT
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 180
          docker compose ps
          python3 - <<'PY'
          import json, subprocess
          for service, host_port, port in [('frontend','8080','8080/tcp'),('backend','8000','8000/tcp')]:
              cid=subprocess.check_output(['docker','compose','ps','-q',service],text=True).strip()
              obj=json.loads(subprocess.check_output(['docker','inspect',cid],text=True))[0]
              assert obj['NetworkSettings']['Ports'][port]==[{'HostIp':'127.0.0.1','HostPort':host_port}]
              print(service, 'publication 127.0.0.1:'+host_port, 'OK')
          cid=subprocess.check_output(['docker','compose','ps','-q','db'],text=True).strip()
          obj=json.loads(subprocess.check_output(['docker','inspect',cid],text=True))[0]
          assert all(v is None for v in obj['NetworkSettings']['Ports'].values())
          print('PostgreSQL non publié: OK')
          PY
          curl --fail --silent --show-error http://127.0.0.1:8080/health/ready
          python3 scripts/smoke.py http://127.0.0.1:8080
          # Depuis un autre espace réseau : accéder à la passerelle, et pas à sa propre boucle locale.
          docker run --rm --add-host=host.docker.internal:host-gateway curlimages/curl:8.12.1 --connect-timeout 3 --max-time 5 --fail http://host.docker.internal:8080/health/ready && { echo 'ECHEC: frontend accessible hors boucle locale'; exit 1; } || test "$?" -eq 7 -o "$?" -eq 28
          echo 'Test hors boucle locale terminé'
          docker compose stop backend
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health/ready)
          test "$code" = 502
          docker compose up -d --wait --wait-timeout 180
          curl --fail --silent --show-error http://127.0.0.1:8080/health/ready
          echo 'Reprise API vérifiée sur runner'
  schemas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Contrôle structurel et rendus des 13 exports
        shell: bash
        run: |
          python3 .github/qualification/recette_schemas.py
        env:
          PYTHONUNBUFFERED: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recette-visuelle-svg
          path: /tmp/recette-schemas/
          retention-days: 7
