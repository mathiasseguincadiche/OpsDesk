name: One-time read-only scan for leaked credentials in Git history
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/privacy-history-secrets-audit.yml
permissions:
  contents: read

jobs:
  full-history-secret-check:
    if: github.repository == 'mathiasseguincadiche/OpsDesk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Scan all Git refs without publishing any secret values
        env:
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$REPO" != "mathiasseguincadiche/OpsDesk" ]]; then exit 2; fi
          git clone --mirror --quiet "https://github.com/${REPO}.git" "${RUNNER_TEMP}/mirror.git"
          ref_count="$(git --git-dir="${RUNNER_TEMP}/mirror.git" for-each-ref --format='%(refname)' | wc -l)"
          echo "Git references inspected: ${ref_count}"
          docker run --rm \
            -v "${RUNNER_TEMP}/mirror.git:/repo:ro" \
            -v "${RUNNER_TEMP}:/out" \
            ghcr.io/gitleaks/gitleaks:v8.24.2@sha256:58c180146f495109b851e82278c9cf43d1055b622287a4b6a464087f0c0dbf43 \
            git --log-opts="--all" --no-banner --redact=100 \
            --report-format=json --report-path=/out/gitleaks-report.json \
            --exit-code=0 /repo > "${RUNNER_TEMP}/gitleaks-suppressed.log" 2>&1
          if [[ ! -s "${RUNNER_TEMP}/gitleaks-report.json" ]]; then
            echo "No report was generated; do not infer a clean scan"
            exit 3
          fi
          python3 - <<'PY'
          import collections
          import json
          import os
          path = os.environ['RUNNER_TEMP'] + '/gitleaks-report.json'
          data = json.load(open(path, encoding='utf-8'))
          if not isinstance(data, list):
              raise SystemExit('Unexpected Gitleaks report format')
          rules = collections.Counter(str(x.get('RuleID', 'unspecified')) for x in data)
          print(f'Potential credential findings across Git history: {len(data)}')
          print(f'Detection rule categories triggered: {len(rules)}')
          # Do not publish file paths, commit SHAs, matching lines, or secrets.
          print('Raw findings retained only in ephemeral runner filesystem; none uploaded')
          print('Audit only: no GitHub refs were modified')
          PY
