<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" width="1280" height="700" role="img" aria-labelledby="title desc"><title id="title">OpsDesk — fonctionnement général</title><desc id="desc">Fonctionnement historique du service tickets : utilisateur, application, base de données, stockage persistant. Limitations : données fictives, pas d'authentification, aucune production.</desc><rect x="0" y="0" width="1280" height="700" rx="0" fill="#f7f9fc" stroke="#f7f9fc" stroke-width="0"/><rect x="0" y="0" width="1280" height="8" rx="0" fill="#2563eb" stroke="#2563eb" stroke-width="0"/><rect x="48" y="163" width="1184" height="317" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="82" y="252" width="223" height="147" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="357" y="252" width="254" height="147" rx="14" fill="#ecfdf5" stroke="#087a68" stroke-width="2"/><rect x="671" y="252" width="254" height="147" rx="14" fill="#f5f3ff" stroke="#6941c6" stroke-width="2"/><rect x="985" y="252" width="210" height="147" rx="14" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><rect x="48" y="510" width="574" height="116" rx="14" fill="#eff6ff" stroke="#9bbef2" stroke-width="2"/><rect x="644" y="510" width="588" height="116" rx="14" fill="#fff7ed" stroke="#edc9a5" stroke-width="2"/><line x1="306" y1="321" x2="345" y2="321" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><polygon points="355,321 345,326 345,316" fill="#2563eb"/><line x1="613" y1="321" x2="659" y2="321" stroke="#087a68" stroke-width="3" stroke-linecap="round"/><polygon points="669,321 659,326 659,316" fill="#087a68"/><line x1="928" y1="321" x2="983" y2="321" stroke="#b45309" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/><text x="57" y="71" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="34" fill="#172033">OpsDesk — fonctionnement général</text><text x="57" y="112" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="18" fill="#475569">Prototype local historique · vue fonctionnelle, pas preuve d'un service actuellement en ligne</text><text x="76" y="205" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="22" fill="#172033">Un utilisateur crée et suit une demande IT</text><text x="193.5" y="288" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="18" fill="#2563eb">UTILISATEUR</text><text x="193.5" y="339" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="18" fill="#172033">Crée et consulte</text><text x="193.5" y="372" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="18" fill="#172033">des tickets IT</text><text x="484" y="288" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="18" fill="#087a68">APPLICATION</text><text x="484" y="339" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="18" fill="#172033">Gère les demandes</text><text x="484" y="372" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="18" fill="#172033">et leurs statuts</text><text x="798" y="288" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="18" fill="#6941c6">BASE DE TICKETS</text><text x="798" y="339" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="18" fill="#172033">Enregistre et relit</text><text x="798" y="372" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="18" fill="#172033">les demandes</text><text x="1090" y="288" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="18" fill="#b45309">STOCKAGE</text><text x="1090" y="339" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="18" fill="#172033">Volume persistant</text><text x="1090" y="372" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="18" fill="#172033">de la base</text><text x="334" y="295" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="15" fill="#475569">utilise</text><text x="642.5" y="295" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="15" fill="#475569">tickets</text><text x="956.5" y="294" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="14" fill="#475569">montage</text><text x="79" y="445" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="18" fill="#475569">La persistance du volume ne démontre ni sauvegarde indépendante ni restauration validée.</text><text x="66" y="543" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="17" fill="#2563eb">PORTÉE DE LA FIGURE</text><text x="66" y="584" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="18" fill="#172033">Essai Ubuntu / WSL2 avec Docker Compose.</text><text x="66" y="613" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="18" fill="#172033">Infrastructure personnelle non réceptionnée.</text><text x="661" y="543" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="17" fill="#b45309">LIMITES DU PROTOTYPE</text><text x="661" y="584" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="18" fill="#172033">Données fictives ; pas d'authentification.</text><text x="661" y="613" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="18" fill="#172033">Aucun usage public ou en production validé.</text><text x="57" y="680" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="17" fill="#475569">Flèches pleines : interactions · trait pointillé : montage de stockage. Phases du parcours : voir README.</text></svg>