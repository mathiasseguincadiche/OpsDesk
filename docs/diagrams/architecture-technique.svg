<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" width="1280" height="880" role="img" aria-labelledby="title desc"><title id="title">OpsDesk — architecture technique de référence</title><desc id="desc">Architecture de l'essai historique Ubuntu WSL2 avec navigateur, deux services Compose app et db, ports 18081 vers 8000 puis db:5432, rôle SQL, volume monté hors du réseau.</desc><rect x="0" y="0" width="1280" height="880" rx="0" fill="#f7f9fc" stroke="#f7f9fc" stroke-width="0"/><rect x="0" y="0" width="1280" height="8" rx="0" fill="#2563eb" stroke="#2563eb" stroke-width="0"/><rect x="43" y="148" width="1194" height="633" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="354" y="259" width="838" height="347" rx="14" fill="#f1f7ff" stroke="#70a8eb" stroke-width="2"/><rect x="70" y="365" width="237" height="148" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><rect x="406" y="365" width="309" height="148" rx="14" fill="#ecfdf5" stroke="#087a68" stroke-width="2"/><rect x="815" y="365" width="328" height="148" rx="14" fill="#f5f3ff" stroke="#6941c6" stroke-width="2"/><rect x="817" y="645" width="327" height="97" rx="14" fill="#fff7ed" stroke="#b45309" stroke-width="2"/><line x1="309" y1="438" x2="394" y2="438" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/><polygon points="404,438 394,443 394,433" fill="#2563eb"/><line x1="717" y1="438" x2="803" y2="438" stroke="#6941c6" stroke-width="3" stroke-linecap="round"/><polygon points="813,438 803,443 803,433" fill="#6941c6"/><line x1="976" y1="514" x2="976" y2="643" stroke="#b45309" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6"/><text x="57" y="68" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="33" fill="#172033">OpsDesk — architecture technique de référence</text><text x="57" y="112" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="18" fill="#475569">Essai historique Ubuntu / WSL2 + Docker Compose · pas un déploiement personnel actuel</text><text x="66" y="186" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="21" fill="#475569">HÔTE DU LABORATOIRE HISTORIQUE — UBUNTU / WSL2</text><text x="66" y="222" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="17" fill="#475569">Port historique lié à 127.0.0.1 ; la nouvelle machine et son écoute devront être vérifiées.</text><text x="380" y="297" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="17" fill="#1d5db1">Réseau logique Compose : v42opsdesk_net (ne constitue pas une frontière de sécurité forte)</text><text x="189.5" y="405" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="19" fill="#2563eb">NAVIGATEUR</text><text x="189.5" y="449" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="19" fill="#172033">Lit et crée</text><text x="189.5" y="480" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="19" fill="#172033">des tickets</text><text x="560" y="406" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="20" fill="#087a68">Service app</text><text x="560" y="448" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="19" fill="#172033">Gunicorn / Flask</text><text x="560" y="479" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="18" fill="#172033">Pages et API tickets</text><text x="978" y="406" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="20" fill="#6941c6">Service db</text><text x="978" y="443" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="18" fill="#172033">PostgreSQL · port 5432</text><text x="978" y="467" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="18" fill="#172033">Rôle SQL opsdesk_app</text><text x="380" y="330" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="17" fill="#2563eb">HTTP 127.0.0.1:18081</text><text x="380" y="351" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16" fill="#475569">→ port interne 8000</text><text x="765" y="411" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="17" fill="#6941c6">db:5432</text><text x="986.5" y="491" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="17" fill="#475569">Droits tickets (≠ propriétaire)</text><text x="981" y="679" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="19" fill="#b45309">VOLUME NOMMÉ</text><text x="981" y="719" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="18" fill="#172033">v42opsdesk_pgdata</text><text x="988" y="591" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16" fill="#b45309">Montage local de stockage</text><text x="65" y="761" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16" fill="#475569">PostgreSQL non publié ; aucune authentification utilisateur dans l'essai historique.</text><text x="57" y="817" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="17" fill="#475569">Légende : flèche pleine = communication · trait pointillé = montage · volume ≠ sauvegarde / PRA.</text><text x="57" y="859" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16" fill="#475569">Schéma de référence historique : toute nouvelle configuration doit être vérifiée sur son propre environnement.</text></svg>