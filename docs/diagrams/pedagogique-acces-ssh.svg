an style="font-size:12px">est-il celui<br />attendu ?</span><br /><br /><span style="font-size: 12px; color: rgb(89, 106, 128);">empreinte de clé</span></div></div></div></foreignObject><text x="738" y="101" fill="#1D293B" font-family="Arial" font-size="13px" text-anchor="middle" style="fill: rgb(29, 41, 59);"><tspan x="738" y="101">ÉTAPE 5</tspan><tspan x="738" y="117">Le serveur</tspan><tspan x="738" y="133">est-il celui</tspan><tspan x="738" y="149">attendu ?</tspan><tspan x="738" y="165"></tspan><tspan x="738" y="181">empreinte de clé</tspan></text></switch></g></g></g><g data-cell-id="c13"><g><path d="M 648 137 L 657.76 137" fill="none" stroke="#33445d" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(51, 68, 93);"/><path d="M 665.76 137 L 657.76 141 L 657.76 133 Z" fill="#33445d" stroke="#33445d" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(51, 68, 93); stroke: rgb(51, 68, 93);"/></g></g><g data-cell-id="c14"><g><rect x="828" y="62" width="140" height="150" rx="11.2" ry="11.2" fill="#eaf8f3" stroke="#007c6c" stroke-width="1.5" pointer-events="all" style="fill: rgb(234, 248, 243); stroke: rgb(0, 124, 108);"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe center; width: 138px; height: 1px; padding-top: 137px; margin-left: 829px;"><div style="box-sizing: border-box; font-size: 0; text-align: center; color: #1D293B; "><div style="display: inline-block; font-size: 13px; font-family: Arial; color: #1D293B; line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; "><span style="font-size: 12px; color: rgb(0, 124, 108);"><b>ÉTAPE 6</b></span><br /><b style="font-size:15px">Le compte</b><br /><span style="font-size:12px">est-il accepté,<br />avec quels droits ?</span><br /><br /><span style="font-size: 12px; color: rgb(89, 106, 128);">id · sudo -l</span></div></div></div></foreignObject><text x="898" y="101" fill="#1D293B" font-family="Arial" font-size="13px" text-anchor="middle" style="fill: rgb(29, 41, 59);"><tspan x="898" y="101">ÉTAPE 6</tspan><tspan x="898" y="117">Le compte</tspan><tspan x="898" y="133">est-il accepté,</tspan><tspan x="898" y="149">avec quels droits ?</tspan><tspan x="898" y="165"></tspan><tspan x="898" y="181">id · sudo -l</tspan></text></switch></g></g></g><g data-cell-id="c15"><g><path d="M 808 137 L 817.76 137" fill="none" stroke="#33445d" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(51, 68, 93);"/><path d="M 825.76 137 L 817.76 141 L 817.76 133 Z" fill="#33445d" stroke="#33445d" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(51, 68, 93); stroke: rgb(51, 68, 93);"/></g></g><g data-cell-id="c16"><g><rect x="28" y="226" width="944" height="60" fill="none" stroke="none" pointer-events="all"/></g><g><g><switch><foreignObject style="overflow: visible; text-align: left;" pointer-events="none" width="100%" height="100%" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"><div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: unsafe center; justify-content: unsafe flex-start; width: 942px; height: 1px; padding-top: 256px; margin-left: 30px;"><div style="box-sizing: border-box; font-size: 0; text-align: left; color: #33445D; "><div style="display: inline-block; font-size: 13px; font-family: Arial; color: #33445D; line-height: 1.2; pointer-events: all; white-space: normal; word-wrap: normal; ">Chaque étape répond à une seule question. Un succès à une étape ne prouve pas la suivante : un <b>ping</b> qui répond ne dit rien du port 22, et une adresse joignable ne dit rien du compte. On s'arrête à la première étape en échec, et on ne change qu'une chose à la fois.</